<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>GHOST HACKER: TIME MACHINE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e8e8ec;
      font-family: -apple-system, "Hiragino Sans", sans-serif;
    }
    .tm-app {
      width: min(480px, 90vw);
      padding: 2rem;
      border: 1px solid #2a2d36;
      border-radius: 12px;
      background: #161922;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.9rem;
    }
    .tm-app h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.04em; }
    .tm-sub { color: #7a7f8f; font-size: 0.85rem; margin: 0; }
    .tm-depth { font-size: 1rem; color: #cfd3e0; }
    .tm-difficulty { font-size: 2rem; font-weight: 700; letter-spacing: 0.03em; }
    .tm-power { color: #9096a8; font-size: 0.85rem; }
    .tm-controls { display: flex; gap: 0.6rem; }
    .tm-controls button {
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #3a3f4d;
      background: #1e2230;
      color: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .tm-controls button:hover { background: #2a3040; }
    .tm-descend { font-size: 0.9rem !important; letter-spacing: 0.05em; }
    .tm-retreat { font-size: 0.9rem !important; letter-spacing: 0.05em; }
    .tm-judgment { font-size: 1.3rem; font-weight: 700; }
    .tm-hint { color: #7a7f8f; font-size: 0.8rem; margin: 0; }
    .tm-ghosts { color: #cfd3e0; font-size: 0.85rem; }
    .tm-app button.tm-restart {
      padding: 0.7rem 2rem;
      border-radius: 8px;
      border: 1px solid #3a3f4d;
      background: #1e2230;
      color: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
